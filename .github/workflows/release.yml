name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.1.0'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    # Needed to push the release tag and create the GitHub release;
    # also pins the token to the least privilege the job requires.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version
        run: mvn versions:set -DnewVersion=${{ inputs.version }} --batch-mode

      - name: Build and test
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: Publish to Maven Central
        run: mvn deploy --batch-mode --no-transfer-progress -P release -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true
